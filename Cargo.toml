[package]
name = "rustcast"
version = "0.7.2"
edition = "2024"
license = "MIT"
description = "RustCast - Productivity launcher for Linux (X11/XWayland)"
homepage = "https://rustcast.app"
repository = "https://github.com/RustCastLabs/rustcast"

[dependencies]
arboard = "3.6.1"
# xdg-desktop-portal ScreenCast (Wayland window/monitor recording)
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "screencast"] }
crossbeam-channel = "0.5.15"
dirs = "5.0"
emojis = "0.8.0"
global-hotkey = "0.7.0"
iced = { version = "0.14.0", features = ["image", "tokio"] }
image = { version = "0.25.9", features = ["png"] }
libc = "0.2.180"
log = "0.4.29"
once_cell = "1.21.3"
rand = "0.9.2"
rayon = "1.11.0"
rfd = "0.17.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.48.0", features = ["full"] }
toml = "0.9.8"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
# default features pull in `libxdo` (xdotool) for Copy/Paste menu accelerators
# we don't use; disabling avoids a hard dependency on libxdo-dev.
tray-icon = { version = "0.21.3", default-features = false }
url = { version = "2.5.8", default-features = false }
x11rb = { version = "0.13.2", features = ["xtest", "randr", "composite", "shm", "xfixes", "shape"] }

# tray-icon on Linux drives a GTK event loop
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[dev-dependencies]
tempfile = "3.23.0"
