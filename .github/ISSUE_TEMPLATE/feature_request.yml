name: Feature request
description: Suggest something RustCast should do
title: "[Feature]: "
labels: [enhancement, needs triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or workflow, not the solution yet.
      placeholder: Every morning I have to ...
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like RustCast to do?
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you handle it today?
      description: Other apps, scripts or workarounds you use.
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'd like to help build this
