name: Release

# A release is published for every new version in Cargo.toml:
# - push to main that changes the version -> builds, tags v<version>, publishes
# - pushing a v<version> tag does the same
# - running the workflow by hand publishes the current version if it isn't out yet
on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - .github/release-notes.md
      - .github/workflows/release.yml
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Is this version released?
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag is already released"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build and publish (x86_64 Linux)
    needs: check
    if: needs.check.outputs.publish == 'true'
    # The oldest supported runner, so the binary runs on older glibc too.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release --all-targets

      - name: Build
        run: cargo build --release

      - name: Package
        run: scripts/release/package.sh

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: RustCast ${{ needs.check.outputs.tag }}
          body_path: .github/release-notes.md
          make_latest: true
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
